href="assets/style.css">

</head>

<body>

<header class="navbar">

<a class="brand"
href="index.html">

🔎 Campus Lost & Found

</a>

<nav>

<a href="index.html">
Home

<a href="report.html">
Report Item

href="items.html">

</nav>

</header>

<main class="container">

<div class="page-head">

<div>

<span class="eyebrow">
Search & Filter
</span>

<h1>
Browse reported items
</h1>

<p>
Search the campus reports and submit a claim
when you find a possible match.
</p>

</div>

</div>

<section class="filter-card">

<input
id="searchInput"
placeholder="Search by item, description or location...">

<select id="typeFilter">

<option value="">
All Types
</option>

<option>
Lost
</option>

<option>
Found
</option>

</select>

<select id="categoryFilter">

<option value="">
All Categories
</option>

<option>Electronics</option>
<option>Documents</option>
<option>Accessories</option>
<option>Books</option>
<option>Clothing</option>
<option>Keys</option>
<option>Other</option>

</select>

<select id="statusFilter">

<option value="">
All Status
</option>

<option>
Open
</option>

<option>
Claim Pending
</option>

<option>
Resolved
</option>

</select>

</section>

<div
id="itemsGrid"
class="grid three">

</div>

</main>

<footer>
Campus Lost & Found • MCA 3rd Semester Minor Project
</footer>

setupItemsPage();
</script>
